# christmas_tree.py — a tree that grows as you type
import numpy as np
import time, sys

TAU = 2 * np.pi
GOLD = (255, 215, 90)
RAMP = " .:-=+*o%#&W@"
rng = np.random.default_rng(1225)


class Particle:
    __slots__ = ("y", "phi", "r", "rgb", "light")

    def __init__(self, y, phi, r, rgb, light=False):
        self.y, self.phi, self.r = y, phi, r
        self.rgb, self.light = rgb, light


class Tree:
    def __init__(self, height=1.0, radius=0.42, tiers=5):
        self.h, self.R, self.tiers = height, radius, tiers
        self.parts, self.theta = [], 0.0

    def radius_at(self, y):
        tier = (y * self.tiers) % 1.0
        return self.R * (1 - y) * (0.7 + 0.3 * (1 - tier))

    def grow_needles(self, n=2200):
        Y = 1 - np.sqrt(rng.random(n))
        phi = rng.random(n) * TAU
        for y, p in zip(Y, phi):
            r = self.radius_at(y) * (0.75 + 0.25 * rng.random())
            g = int(120 + 100 * rng.random())
            self.parts.append(Particle(y, p, r, (40, g, 90)))

    def hang_lights(self, n=111):
        lp = np.array([(255, 230, 170), (255, 70, 70),
                       (80, 240, 120), (255, 110, 220), GOLD], float)
        for i in range(n):
            y = 1 - np.sqrt(rng.random())
            c = lp[rng.integers(0, len(lp))]
            self.parts.append(Particle(y, rng.random() * TAU,
                                       self.radius_at(y), c, True))

    def wrap_garland(self, turns=4.5, steps=420):
        for t in np.linspace(0, 1, steps):
            y = t * 0.95
            self.parts.append(Particle(y, t * turns * TAU,
                                       self.radius_at(y) * 1.02, GOLD))

    def project(self, p, cols, rows):
        a = p.phi + self.theta
        x, z = p.r * np.cos(a), p.r * np.sin(a)
        col = int(cols / 2 + x * rows / 0.6)
        row = int(rows * 0.85 - p.y * rows * 0.7)
        return col, row, z

    def render(self, cols=120, rows=60):
        grid = [[" "] * cols for _ in range(rows)]
        zbuf = np.full((rows, cols), -np.inf)
        for p in self.parts:
            c, r, z = self.project(p, cols, rows)
            if 0 <= c < cols and 0 <= r < rows and z > zbuf[r, c]:
                zbuf[r, c] = z
                d = (z / max(p.r, 1e-6) + 1) / 2
                grid[r][c] = RAMP[int(d * (len(RAMP) - 1))]
        return "\n".join("".join(row) for row in grid)


def wrap_presents(count=5):
    boxes = []
    for i in range(count):
        w, h = rng.integers(7, 13), rng.integers(4, 7)
        ribbon = GOLD if i % 2 else (255, 70, 70)
        boxes.append(dict(w=w, h=h, ribbon=ribbon, bow="\\o/"))
    return boxes


def let_it_snow(n=110):
    return [(rng.random(), -rng.random()) for _ in range(n)]


def santa_flyby(t, width=120):
    sleigh = r' <(")-<(")-<(")~~~~[###]> '
    return sleigh, int(width - (t * 6) % (width + len(sleigh)))


def place_star():
    return ["  \\ | /  ", "-- (*) --", "  / | \\  "]


if __name__ == "__main__":
    tree = Tree()
    tree.grow_needles()
    tree.hang_lights()
    tree.wrap_garland()
    gifts = wrap_presents()
    snow = let_it_snow()
    star = place_star()
    while True:
        tree.theta += 0.04
        sys.stdout.write("\x1b[H" + tree.render())
        time.sleep(1 / 30)  # Merry Christmas ✦

# psst... tap the presents 🎁
</script>

  ctx.font = `600 ${fs}px ui-monospace,"SF Mono",Menlo,Consolas,monospace`;

  // bloom
  sctx.clearRect(0, 0, small.width, small.height);
  sctx.drawImage(cvs, 0, 0, small.width, small.height);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; ctx.imageSmoothingEnabled = true;
  ctx.drawImage(small, 0, 0, cvs.width, cvs.height);
  ctx.restore();
  drawPhoto(t);
  ctx.font = `600 ${fs}px ui-monospace,"SF Mono",Menlo,Consolas,monospace`; ctx.textBaseline = 'top';

  // panel + hud
  if (codeDirty) { renderCode(); codeDirty = false; }
  hudT -= dt;
  if (hudT <= 0) {
    hudT = 0.2;
    if (done) { statusEl.className = 'run'; stxt.textContent = `running · ${fps} fps`; }
    else { statusEl.className = ''; stxt.textContent = started ? `building… ${Math.round(p * 100)}%` : 'ready'; }
    hud.innerHTML = `<b>christmas_tree</b>\nrotation    ${((theta * 180 / Math.PI) % 360).toFixed(1)}°\nlights      ${litNow}\ncharacters  ${drawn.toLocaleString()}\nlines       ${SRC.slice(0, typed).split('\n').length}`;
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', () => { layout(); codeDirty = true; });

// ---------- intro: terminal -> letter -> open ----------
const intro = document.getElementById('intro'), screenEl = document.getElementById('screen');
const sleep = ms => new Promise(r => setTimeout(r, ms));
// terminal buffer: array of html lines; special slots for the envelope & menu
let tLines = [], envSlot = -1, envState = null, cursorOn = false;
function paint() {
  const lines = tLines.map((l, i) => i === envSlot ? '<span id="envHost"></span>' : l);
  screenEl.innerHTML = lines.join('\n') + (cursorOn ? '<span class="cur"></span>' : '');
  const host = document.getElementById('envHost');
  if (host) host.replaceWith(envBox);
}
async function typeLine(prefix, text, cls, speed = 55) {
  const idx = tLines.length; tLines.push(prefix);
  for (let i = 1; i <= text.length; i++) {
    tLines[idx] = prefix + `<span class="${cls}">${esc(text.slice(0, i))}</span>`;
    paint(); await sleep(speed + Math.random() * speed * 0.8);
  }
  return idx;
}

// --- envelope + letter (crisp line art, terminal colors) ---
const envBox = document.createElement('div');
envBox.className = 'envbox';
(() => { const st = document.createElement('style');
  st.textContent = `
  #screen .envbox { display: block; white-space: normal; margin: 14px 0 4px; width: 220px; }
  #screen .envbox svg { display: block; overflow: visible; filter: drop-shadow(0 0 3px rgba(200,225,255,.45)); animation: crtFlick 3.2s steps(1) infinite; }
  @keyframes crtFlick { 0%, 100% { opacity: .92; } 7% { opacity: .78; } 8% { opacity: .95; } 52% { opacity: .86; } 53% { opacity: .96; } }
  #screen .envbox.reveal { animation: wipeIn .7s steps(14) both; }
  #screen .envbox.wipeout { animation: wipeOut .6s steps(12) both; }
  @keyframes wipeIn { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes wipeOut { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 100% 0); } }
  #screen .tw { animation: tw 1.8s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: .1; } 50% { opacity: 1; } }
  #screen .opt.retry { display: inline; }`;
  document.head.appendChild(st); })();
const MONO = 'ui-monospace, SF Mono, Menlo, Consolas, monospace';
const STARS = [[24, 34, '+', '#9fb4ff', 0], [58, 92, '*', '#ffe9a8', .5], [96, 18, '·', '#ffffff', 1.1], [150, 60, '+', '#ffe9a8', .3],
               [188, 26, '*', '#9fb4ff', .9], [202, 100, '·', '#ffffff', 1.4], [126, 108, '+', '#9fb4ff', 1.7], [14, 112, '·', '#ffe9a8', .7]];
// ascii line art: characters placed along exact straight lines (no grid jaggies)
function aLine(x1, y1, x2, y2, ch, step, col, skipEnds) {
  const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(len / step));
  let out = '';
  for (let i = skipEnds ? 1 : 0; i <= (skipEnds ? n - 1 : n); i++) {
    const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n;
    out += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}">${ch}</text>`;
  }
  return `<g fill="${col}" font-size="13" font-family="${MONO}" text-anchor="middle" dominant-baseline="central">${out}</g>`;
}
function aBox(x, y, w, h, col) {
  return aLine(x, y, x + w, y, '-', 7.2, col, true) + aLine(x, y + h, x + w, y + h, '-', 7.2, col, true) +
         aLine(x, y, x, y + h, '|', 13, col, true) + aLine(x + w, y, x + w, y + h, '|', 13, col, true) +
         `<g fill="${col}" font-size="13" font-family="${MONO}" text-anchor="middle" dominant-baseline="central">` +
         `<text x="${x}" y="${y}">+</text><text x="${x + w}" y="${y}">+</text><text x="${x}" y="${y + h}">+</text><text x="${x + w}" y="${y + h}">+</text></g>`;
}
function envSVG(st) {
  const fy = st.flapY, py = st.paperY, W0 = '#e9f0ff', DIM = '#4a5070';
  const up = fy < 130;
  const flapFill = `<path d="M10,130 L110,${fy} L210,130 Z" fill="#000"/>`;
  const flapEdge = aLine(10, 130, 110, fy, up ? '/' : '\\', 7, W0, true) + aLine(110, fy, 210, 130, up ? '\\' : '/', 7, W0, true) +
    (Math.abs(fy - 130) > 4 ? `<g fill="${W0}" font-size="13" font-family="${MONO}" text-anchor="middle" dominant-baseline="central"><text x="110" y="${fy}">${up ? '^' : 'v'}</text></g>` : aLine(14, 128, 206, 128, '_', 7.2, W0));
  const seal = fy >= 178 ? `<text x="110" y="${fy}" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="700" fill="#ff6b9a" font-family="${MONO}">@</text>` : '';
  const stars = st.stars ? STARS.map(([x, y, ch, col, d]) =>
    `<text class="tw" style="animation-delay:${d}s" x="${x}" y="${y}" fill="${col}" font-size="13" font-family="${MONO}">${ch}</text>`).join('') : '';
  const paper = `<g clip-path="url(#pclip)"><g transform="translate(0,${py})">
      <rect x="32" y="0" width="156" height="130" fill="#000"/>
      ${aBox(32, 0, 156, 130, '#ffffff')}
      <text x="110" y="1" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ffd34d" font-family="${MONO}">*</text>
      <text x="48" y="28" font-size="12.5" font-weight="700" fill="#ff9fd6" font-family="${MONO}">Dear Ayeong,</text>
      <text x="56" y="52" font-size="12.5" fill="#fff" font-family="${MONO}">Merry Christmas</text>
      <text x="56" y="69" font-size="12.5" fill="#ffd34d" font-family="${MONO}">    and</text>
      <text x="56" y="86" font-size="12.5" fill="#fff" font-family="${MONO}">Happy New Year!</text>
      <text x="172" y="107" text-anchor="end" font-size="12.5" fill="#ff6b9a" font-family="${MONO}">&lt;3</text>
    </g></g>`;
  return `<svg width="220" height="232" viewBox="0 0 220 232">
    <defs><clipPath id="pclip"><rect x="0" y="-40" width="220" height="170"/></clipPath></defs>
    ${stars}
    ${up ? flapFill + flapEdge : ''}
    ${paper}
    <rect x="10" y="130" width="200" height="92" fill="#000"/>
    ${aBox(10, 130, 200, 92, W0)}
    ${up ? '' : aLine(16, 216, 84, 176, '/', 8, DIM, false) + aLine(204, 216, 136, 176, '\\', 8, DIM, false)}
    ${up ? aLine(16, 134, 110, 180, '\\', 8, DIM, false) + aLine(204, 134, 110, 180, '/', 8, DIM, false) : ''}
    <text x="110" y="205" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ff9fd6" font-family="${MONO}">To. Ayeong</text>
    ${up ? '' : flapFill + flapEdge + seal}
  </svg>`;
}
function renderEnv() { envBox.innerHTML = envSVG(envState); }
let flick = null;
const ease = t => 1 - Math.pow(1 - t, 3);
async function tween(ms, fn) {
  const t0 = performance.now();
  while (true) { const k = Math.min(1, (performance.now() - t0) / ms); fn(ease(k)); if (k >= 1) break; await sleep(16); }
}

// --- select menu ---
const OPTS = ['open the letter', 'not yet'];
let sel = 0, menuIdx = -1, menuOn = false, busy = false, retryOn = false;
function renderMenu() {
  tLines[menuIdx] = `<span class="g">?</span> <span class="w">what do you want to do?</span> <span class="dim">(↑↓ · enter)</span>\n` +
    OPTS.map((o, i) => `<span class="opt${i === sel ? ' sel' : ''}" data-i="${i}">${i === sel ? '❯ ' : '  '}${o}</span>`).join('\n');
  paint();
}
screenEl.addEventListener('click', e => {
  const o = e.target.closest('.opt'); if (!o) return;
  if (o.dataset.retry !== undefined) { if (retryOn) retry(); return; }
  if (menuOn && !busy) choose(+o.dataset.i);
});
screenEl.addEventListener('mousemove', e => { const o = e.target.closest('.opt'); if (o && o.dataset.i !== undefined && menuOn && !busy && +o.dataset.i !== sel) { sel = +o.dataset.i; renderMenu(); } });
addEventListener('keydown', e => {
  if (retryOn && (e.key === 'Enter' || e.key === ' ')) { retry(); e.preventDefault(); return; }
  if (!menuOn || busy) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { sel = 1 - sel; renderMenu(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { choose(sel); e.preventDefault(); }
});
function choose(i) {
  busy = true; menuOn = false; sel = i;
  tLines[menuIdx] = `<span class="g">✔</span> <span class="w">what do you want to do?</span> <span class="y">${OPTS[i]}</span>`;
  paint();
  if (i === 0) openLetter(); else sayBye();
}

async function runIntro(skipLogin) {
  tLines = [`<span class="dim">Last login: Thu Dec 24 23:59:59 on ttys001</span>`, `<span class="g">~</span> <span class="w">$</span> `];
  envSlot = -1; menuIdx = -1; sel = 0; busy = false; menuOn = false; retryOn = false;
  envBox.className = 'envbox';
  cursorOn = true; paint();
  await sleep(skipLogin ? 600 : 1500);
  cursorOn = false;
  tLines.pop();
  await typeLine(`<span class="g">~</span> <span class="w">$</span> `, 'A Christmas letter has arrived.', 'w', 60);
  cursorOn = true; paint(); await sleep(450); cursorOn = false;
  tLines.push(''); menuIdx = tLines.length - 1; renderMenu();
  await sleep(500);
  envState = { flapY: 185, paperY: 135, stars: true };
  renderEnv();
  envBox.className = 'envbox reveal';
  tLines.push(''); envSlot = tLines.length - 1; paint();
  await sleep(750);
  envBox.className = 'envbox';
  menuOn = true;
}
async function openLetter() {
  await sleep(200);
  envState.stars = false;
  // terminal-style: discrete frames with cursor-like blinks instead of smooth motion
  const blink = async (ms = 70) => { envBox.style.visibility = 'hidden'; await sleep(ms); envBox.style.visibility = ''; };
  for (const y of [160, 130, 100, 75]) { envState.flapY = y; renderEnv(); await sleep(170); }
  await sleep(200);
  const ys = [115, 95, 75, 55, 35, 10];
  for (let i = 0; i < ys.length; i++) {
    envState.paperY = ys[i]; renderEnv();
    await sleep(190);
  }
  // time to read
  await sleep(3200);
  // the letter -> the terminal runs the tree
  await typeLine(`<span class="g">~</span> <span class="w">$</span> `, 'python3 christmas_tree.py', 'w', 45);
  cursorOn = true; paint(); await sleep(550); cursorOn = false;
  const build = [
    ['dim', '› compiling christmas_tree.py ...'],
    ['w', '  [1/6] import numpy as np ............. <span class="g">ok</span>'],
    ['w', '  [2/6] Tree.grow_needles(n=2200) ...... <span class="g">ok</span>'],
    ['w', '  [3/6] Tree.hang_lights(n=111) ........ <span class="g">ok</span>'],
    ['w', '  [4/6] Tree.wrap_garland(turns=4.5) ... <span class="g">ok</span>'],
    ['w', '  [5/6] wrap_presents(count=5) ......... <span class="g">ok</span>'],
    ['w', '  [6/6] place_star() ................... <span class="g">ok</span>'],
    ['dim', '› linking ayeong.so ... 3 warnings (too much love)'],
    ['g', '✔ build succeeded in 1.24s'],
    ['dim', '› launching window ...'],
  ];
  for (const [cls, txt] of build) { tLines.push(`<span class="${cls}">${txt}</span>`); paint(); await sleep(cls === 'w' ? 150 + Math.random() * 160 : 380); }
  await sleep(500);
  reset();
  // screen cuts to black instantly, then the editor comes up
  intro.style.transition = 'none';
  intro.classList.add('hide');
  await sleep(600);
  document.body.classList.remove('pre');          // editor panel slides up
  codeDirty = true;
  await sleep(1100);
  document.body.classList.remove('pre-bg');       // tree background appears
  await sleep(1200);
  started = true;
}
async function sayBye() {
  envBox.className = 'envbox wipeout';
  await sleep(650);
  tLines.splice(envSlot, 1); envSlot = -1; paint();
  await sleep(200);
  await typeLine(`<span class="g">~</span> <span class="w">$</span> `, 'okay bye ...', 'pk', 90);
  await sleep(500);
  tLines.push('');
  tLines.push(`<span class="opt sel retry" data-retry>❯ retry</span> <span class="dim">(enter)</span>`);
  paint();
  retryOn = true;
}
function retry() {
  retryOn = false;
  runIntro(true);
}
runIntro();
layout();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
